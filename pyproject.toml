[project]
name = "road-inspection"
version = "1.0.0"
description = "Road inspection record intake with split partitions"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
packages = ["inspection"]
